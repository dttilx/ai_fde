[project]
name = "apx240-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "minio>=7.2,<8",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pymupdf>=1.25,<2",
  "argon2-cffi>=23,<26",
  "python-multipart>=0.0.20,<1",
  "pillow>=11,<13",
  "opencv-python-headless>=4.10,<4.12",
  "qrcode>=8,<9",
  "numpy>=2,<2.3",
  "rapidocr-onnxruntime==1.4.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-jsonschema>=4,<5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = ["integration: requires private PostgreSQL/MinIO services", "live: requires permitted real provider"]
