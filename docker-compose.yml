name: apx240
services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16-bookworm
    environment:
      POSTGRES_USER: apx_admin
      POSTGRES_DB: apx240
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run setup_local.ps1}
      APX_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?run setup_local.ps1}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - apx_pg:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apx_admin -d apx240"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run setup_local.ps1}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run setup_local.ps1}
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["apx_media:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD}
    volumes: ["./scripts/minio-init:/init:ro"]
    entrypoint: ["/bin/sh", "/init/init.sh"]
volumes:
  apx_pg:
  apx_media:
